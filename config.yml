root_path: "/root/autodl-fs/BZNSYP/"

batch_size: 64
num_worker: 8
epochs: 100
train_split: 0.9
seed: 42

learning_rate: 0.001
weight_decay: 0.0001
max_grad_norm: 1.0

sampling_rate: 16000
hop_length_ms: 10
feature_cache_dir: "output/cache-merged/fbank"

input_dim: 80
hidden_dim: 256
num_layers: 3
dropout: 0.1

output_dir: "output/checkpoints-merged"
save_vocab: true

vad:
  max_single_pass_sec: 5.0
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 200
  speech_pad_ms: 100
  merge_gap_sec: 0.15
  max_chunk_sec: 12.0
  min_keep_sec: 0.2
