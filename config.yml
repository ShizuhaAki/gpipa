root_path: "/root/autodl-fs/BZNSYP/"

batch_size: 64
num_worker: 8
epochs: 100
train_split: 0.9
seed: 42

learning_rate: 0.001
weight_decay: 0.0001
max_grad_norm: 1.0

sampling_rate: 16000
hop_length_ms: 10
feature_cache_dir: "output/cache-merged/fbank"

input_dim: 80
hidden_dim: 256
num_layers: 3
dropout: 0.1

checkpoint_dir: "output/checkpoints-merged"
output_dir: output/cli-test
save_vocab: true

vad:
  max_single_pass_sec: 5.0
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 200
  speech_pad_ms: 400
  merge_gap_sec: 0.15
  max_chunk_sec: 12.0
  min_keep_sec: 0.2

g2p:
  custom_phrases:
    你好: [ni2, hao3]
    老虎: [lao3, hu3]
    了解: [liao3, jie3]
    妈妈: [ma1, ma5]
    爸爸: [ba4, ba5]
    我们: [wo3, men5]
    什么: [shen2, me5]
    东西: [dong1, xi5]
    知道: [zhi1, dao5]
    一定: [yi2, ding4]
    不要: [bu2, yao4]

alignment:
  viterbi:
    base_stay_penalty: 0.2
    base_stay_penalty_blank: 0.25
    soft_max_run: 8
    soft_max_run_blank: 8
    overtime_penalty: 0.8
    overtime_penalty_blank: 0.15
    max_run_bucket: 80
